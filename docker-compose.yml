services:
  redis:
    image: redis:7-alpine
    container_name: encurtador-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    container_name: encurtador-backend
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////data/encurtador.db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-before-production}
    volumes:
      - db_data:/data
    depends_on:
      redis:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    container_name: encurtador-frontend
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
volumes:
  redis_data:
  db_data:
